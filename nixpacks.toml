[phases.setup]
nixPkgs = [
    'php84',
    'php84Packages.composer',
    'php84Extensions.pdo_pgsql',
    'php84Extensions.mbstring',
    'php84Extensions.tokenizer',
    'php84Extensions.xml',
    'php84Extensions.ctype',
    'php84Extensions.bcmath',
    'php84Extensions.curl',
    'php84Extensions.zip',
    'nodejs_22',
    'npm-10_x',
]

[phases.install]
cmds = [
    'composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts',
    'npm ci',
]

[phases.build]
cmds = ['npm run build', 'php artisan package:discover --ansi']

[start]
cmd = 'php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-80}'
