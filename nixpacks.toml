[phases.setup]
nixPkgs = [
  'php83',
  'php83Packages.composer',
  'php83Extensions.pdo_pgsql',
  'php83Extensions.mbstring',
  'php83Extensions.tokenizer',
  'php83Extensions.xml',
  'php83Extensions.ctype',
  'php83Extensions.bcmath',
  'php83Extensions.curl',
  'php83Extensions.zip',
  'nodejs_22',
  'npm-10_x'
]

[phases.install]
cmds = [
  'composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts',
  'npm ci'
]

[phases.build]
cmds = [
  'npm run build',
  'php artisan package:discover --ansi'
]

[start]
cmd = 'php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-80}'
